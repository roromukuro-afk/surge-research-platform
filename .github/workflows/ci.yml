name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install worker dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "workers[dev]"
      - name: Lint
        run: ruff check workers scripts
      - name: Unit tests
        run: pytest workers -q

  canonical-prompt-hashes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # RF-14a / RF-14b: registered originals must not drift and the canonical
      # v5.1 must not absorb post-v5.1 decisions.
      - name: Verify MANIFEST hashes and addenda separation
        run: python scripts/verify_manifest_hashes.py

  migrations-and-db-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: surge_ci
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: surge_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install client and test dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          python -m pip install --upgrade pip
          pip install -e "workers[dev]" psycopg2-binary
      # Migrations are run-once and forward-only: the contract is that the whole
      # set applies cleanly to an empty database, which is exactly what this does.
      - name: Apply migrations to a clean database
        run: |
          set -euo pipefail
          for file in $(ls supabase/migrations/*.sql | sort); do
            echo "applying $file"
            psql -v ON_ERROR_STOP=1 -f "$file"
          done
      # The runtime principal is created by a migration only where Vault exists,
      # so the throwaway database gets its own. The password is generated here
      # and masked: no credential, not even a disposable one, lives in the repo.
      - name: Create a least privilege principal for the access tests
        run: |
          set -euo pipefail
          PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$PASSWORD"
          psql -v ON_ERROR_STOP=1 -c "create role surge_worker_prod_app login password '$PASSWORD';"
          psql -v ON_ERROR_STOP=1 -c "grant surge_worker_prod to surge_worker_prod_app;"
          psql -v ON_ERROR_STOP=1 -c "grant connect on database surge_ci to surge_worker_prod_app;"
          echo "SURGE_TEST_WORKER_DSN=postgresql://surge_worker_prod_app:$PASSWORD@localhost:5432/surge_ci" >> "$GITHUB_ENV"
      - name: Database tests (separation, identity, history, as-of, loader)
        env:
          SURGE_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/surge_ci
        run: pytest workers -q -m integration

  web-contracts:
    # The contract views are strings until something runs them. A rename or a
    # missed grant compiles fine and fails in production, so this job applies the
    # migrations to a clean database, connects as the web principal, and reads
    # every contract the way the application reads it.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: surge_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: surge_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply migrations to a clean database
        run: |
          set -euo pipefail
          for file in $(ls supabase/migrations/*.sql | sort); do
            psql -v ON_ERROR_STOP=1 -f "$file" >/dev/null
          done
      - name: Create a login role for the web principal
        run: |
          set -euo pipefail
          PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$PASSWORD"
          psql -v ON_ERROR_STOP=1 -c "create role surge_web_app login password '$PASSWORD';"
          psql -v ON_ERROR_STOP=1 -c "grant surge_web to surge_web_app;"
          psql -v ON_ERROR_STOP=1 -c "grant connect on database surge_ci to surge_web_app;"
          echo "SURGE_WEB_DATABASE_URL=postgresql://surge_web_app:$PASSWORD@localhost:5432/surge_ci" >> "$GITHUB_ENV"
      - name: Install web dependencies
        working-directory: apps/web
        run: npm install --no-audit --no-fund
      - name: Typecheck and build
        working-directory: apps/web
        run: |
          npm run typecheck
          npm run build
      - name: Read every contract as the web principal
        working-directory: apps/web
        run: node scripts/contract-smoke.mjs

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The repository is public: no credentials, raw provider data or research
      # data may ever land in history.
      - name: gitleaks
        run: |
          # --verbose names the file, line and rule for every finding. The value
          # stays hidden behind --redact, so a failure is actionable without the
          # log itself becoming the leak.
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source=/repo --no-banner --redact --verbose --exit-code 1
