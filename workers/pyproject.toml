[project]
name = "surge-workers"
version = "0.1.0"
description = "Phase 1 workers: security master and universe construction."
requires-python = ">=3.12"
dependencies = ["openpyxl>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "pyarrow>=17", "tiktoken>=0.9"]
# Exact token counts for the GPT-OSS models, whose tokeniser (o200k_harmony)
# OpenAI publishes. Optional on purpose: without it the feasibility report
# falls back to its estimate and says so, rather than reporting an estimate
# as though it were a measurement.
tokens = ["tiktoken>=0.9"]
# Canonical price series are stored as Parquet in object storage.
parquet = ["pyarrow>=17"]
# Only needed to talk to Cloudflare R2. Conditional writes (If-None-Match on
# PutObject) need a botocore new enough to send the header.
r2 = ["boto3>=1.35"]
# The JP session close (Yahoo, D-262) reuses the user's screener's browser-like
# HTTPS session (curl_cffi impersonating Chrome) as it is. Tests use fakes and
# do not need it.
yahoo = ["curl_cffi>=0.13,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/surge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: needs a reachable database"]

[tool.ruff]
line-length = 125
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
